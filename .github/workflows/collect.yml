name: Collect news candidates

on:
  workflow_dispatch:
  schedule:
    # ~25 min before each posting slot (8 slots:
    # 05:00, 08:00, 10:00, 11:00, 14:00, 21:00, 23:00, 00:00 IST). Same as "5 23,2,4,5,8,15,17,18 * * *".
    - cron: "5 23 * * *"   # 04:35 IST  -> for the 05:00 IST slot
    - cron: "5 2 * * *"    # 07:35 IST  -> for the 08:00 IST slot
    - cron: "5 4 * * *"    # 09:35 IST  -> for the 10:00 IST slot
    - cron: "5 5 * * *"    # 10:35 IST  -> for the 11:00 IST slot
    - cron: "5 8 * * *"    # 13:35 IST  -> for the 14:00 IST slot
    - cron: "5 15 * * *"   # 20:35 IST  -> for the 21:00 IST slot
    - cron: "5 17 * * *"   # 22:35 IST  -> for the 23:00 IST slot
    - cron: "5 18 * * *"   # 23:35 IST  -> for the 00:00 IST slot

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect news
        run: python collector.py

      - name: Commit data files
        run: |
          git config user.name "x-news-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/candidates.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update news candidates $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push failed, retrying ($i)..."; sleep 5
          done
          exit 1
