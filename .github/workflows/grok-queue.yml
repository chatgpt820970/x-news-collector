name: Build Grok queue

on:
  workflow_dispatch:
  # A push of this file starts one run. The scheduled crons do the daily work.
  # Removed after this caption rebuild so later edits do not queue extra jobs.
  push:
    branches: [main]
    paths:
      - .github/workflows/grok-queue.yml
  schedule:
    # 30 minutes before each Grok day slot (04:47, 07:47, 09:47, 10:47, 13:47 IST).
    - cron: "47 22,1,3,4,7 * * *"
    # 14:55 IST, so the 15:15 reply list is still under 3 hours old.
    # The 09:30 replies are refreshed by the 09:17 IST run above.
    - cron: "25 9 * * *"

permissions:
  contents: write

concurrency:
  group: grok-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg if needed
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

      - name: Self-test
        run: python3 grok_queue.py --self-test

      - name: Build queue
        env:
          CHAD_MEDIA_DEPLOY_KEY: ${{ secrets.CHAD_MEDIA_DEPLOY_KEY }}
        run: python3 grok_queue.py

      - name: Commit queue
        run: |
          git config user.name "x-news-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grok_queue.json data/grok_replies.json data/grok_history.json data/posted.json
          if [ -d data/grok_media ]; then git add data/grok_media; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Grok queue $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push failed, retrying ($i)..."
            sleep 5
          done
          exit 1

      - name: HEAD-check public media URLs
        run: python3 grok_queue.py --verify

      - name: Commit verified queue
        run: |
          git config user.name "x-news-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grok_queue.json data/grok_replies.json
          if git diff --cached --quiet; then
            echo "Verified queue already committed."
            exit 0
          fi
          git commit -m "Verify Grok queue media $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push failed, retrying ($i)..."
            sleep 5
          done
          exit 1

      - name: Publish a copy on the chad-media Pages feed
        env:
          CHAD_MEDIA_DEPLOY_KEY: ${{ secrets.CHAD_MEDIA_DEPLOY_KEY }}
        run: python3 grok_queue.py --publish-pages
